<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Knowledge Assistant — RAG-powered document chat with source citations">
  <title>AI Knowledge Assistant</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    /* ===== CSS CUSTOM PROPERTIES ===== */
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8f7f4;
      --bg-tertiary: #f1efe8;
      --text-primary: #1a1a18;
      --text-secondary: #5f5e5a;
      --text-tertiary: #888780;
      --border: rgba(0, 0, 0, 0.12);
      --border-hover: rgba(0, 0, 0, 0.25);
      --info-bg: #e6f1fb;
      --info-text: #0c447c;
      --info-border: rgba(24, 95, 165, 0.3);
      --success-bg: #eaf3de;
      --success-text: #27500a;
      --success-border: #3b6d11;
      --warning-text: #633806;
      --danger-text: #791f1f;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1c1c1a;
        --bg-secondary: #242422;
        --bg-tertiary: #2c2c2a;
        --text-primary: #e8e6e0;
        --text-secondary: #9c9a92;
        --text-tertiary: #5f5e5a;
        --border: rgba(255, 255, 255, 0.1);
        --border-hover: rgba(255, 255, 255, 0.2);
        --info-bg: #042c53;
        --info-text: #85b7eb;
        --info-border: rgba(55, 138, 221, 0.3);
        --success-bg: #173404;
        --success-text: #c0dd97;
        --success-border: #3b6d11;
      }
    }

    /* ===== RESET & BASE ===== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-primary);
      background: var(--bg-secondary);
    }

    /* ===== MAIN GRID LAYOUT ===== */
    .app-shell {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== LEFT SIDEBAR ===== */
    .sidebar {
      display: flex;
      flex-direction: column;
      background: var(--bg-secondary);
      border-right: 0.5px solid var(--border);
      border-radius: 12px 0 0 12px;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px 16px 12px;
      border-bottom: 0.5px solid var(--border);
    }

    .sidebar-header h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .sidebar-header .doc-count {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    /* ===== UPLOAD ZONE ===== */
    .upload-zone {
      margin: 12px 12px 0;
      padding: 20px 12px;
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }

    .upload-zone:hover,
    .upload-zone.drag-over {
      background: var(--bg-tertiary);
      border-color: var(--border-hover);
    }

    .upload-zone .ti {
      font-size: 22px;
      color: var(--text-tertiary);
    }

    .upload-zone .upload-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .upload-zone .upload-hint {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .upload-zone input[type="file"] {
      display: none;
    }

    /* ===== DOCUMENT LIST ===== */
    .doc-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .doc-list::-webkit-scrollbar {
      width: 4px;
    }

    .doc-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .doc-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 0.5px solid var(--border);
      border-radius: 8px;
      background: var(--bg-primary);
      cursor: pointer;
      transition: border-color 0.15s;
      position: relative;
    }

    .doc-card:hover {
      border-color: var(--border-hover);
    }

    .doc-card.active {
      border-color: var(--info-border);
      border-width: 1.5px;
    }

    .doc-card .file-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .doc-card .file-icon.pdf {
      color: #c0392b;
    }

    .doc-card .file-icon.docx {
      color: #2471a3;
    }

    .doc-card .file-icon.txt {
      color: #7d8c6e;
    }

    .doc-card .doc-info {
      flex: 1;
      min-width: 0;
    }

    .doc-card .doc-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-card .doc-meta {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .doc-card .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .doc-card .status-dot.ready {
      background: #3b6d11;
    }

    .doc-card .status-dot.indexing {
      background: #c98c07;
    }

    .doc-card .status-dot.failed {
      background: #b91c1c;
    }

    .doc-card .doc-status-label {
      font-size: 10px;
      margin-left: -4px;
    }

    .doc-card .doc-status-label.indexing {
      color: var(--warning-text);
    }

    .doc-card .doc-status-label.failed {
      color: var(--danger-text);
    }

    .doc-card .delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: none;
      border: none;
      color: var(--text-tertiary);
      font-size: 14px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
      padding: 2px;
      line-height: 1;
    }

    .doc-card:hover .delete-btn {
      opacity: 1;
    }

    .doc-card .delete-btn:hover {
      color: var(--danger-text);
    }

    /* ===== STATS ROW ===== */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      padding: 12px;
      border-top: 0.5px solid var(--border);
      flex-shrink: 0;
    }

    .stat-card {
      text-align: center;
      padding: 8px 4px;
      border: 0.5px solid var(--border);
      border-radius: 8px;
      background: var(--bg-primary);
    }

    .stat-card .stat-value {
      font-size: 20px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .stat-card .stat-label {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* ===== RIGHT PANEL ===== */
    .chat-panel {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-primary);
      border-radius: 0 12px 12px 0;
    }

    /* ===== TOP BAR ===== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 0.5px solid var(--border);
      flex-shrink: 0;
      gap: 12px;
    }

    .top-bar-left h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .top-bar-left .top-subtitle {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .doc-pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      background: var(--info-bg);
      color: var(--info-text);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-pill-more {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      background: var(--info-bg);
      color: var(--info-text);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }

    .clear-chat-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: none;
      border: 0.5px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-tertiary);
      font-size: 16px;
      transition: color 0.15s, border-color 0.15s;
    }

    .clear-chat-btn:hover {
      color: var(--danger-text);
      border-color: var(--border-hover);
    }

    /* ===== MESSAGES AREA ===== */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .messages-area::-webkit-scrollbar {
      width: 5px;
    }

    .messages-area::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    /* ===== MESSAGE BUBBLES ===== */
    .message-row {
      display: flex;
      max-width: 72%;
    }

    .message-row.user {
      align-self: flex-end;
    }

    .message-row.ai {
      align-self: flex-start;
    }

    .message-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 100%;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message-row.user .message-bubble {
      background: var(--info-bg);
      color: var(--info-text);
      border-bottom-right-radius: 2px;
    }

    .message-row.ai .message-bubble {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 0.5px solid var(--border);
      border-bottom-left-radius: 2px;
    }

    /* ===== CITATION CARD ===== */
    .citation-card {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 12px;
      background: var(--success-bg);
      border-left: 2px solid var(--success-border);
      border-radius: 0 6px 6px 0;
    }

    .citation-card .citation-header {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      color: var(--success-text);
    }

    .citation-card .citation-header .ti {
      font-size: 14px;
    }

    .citation-card .citation-detail {
      font-size: 11px;
      color: var(--success-text);
      opacity: 0.8;
      padding-left: 19px;
    }

    /* ===== TYPING INDICATOR ===== */
    .typing-indicator {
      display: none;
      align-self: flex-start;
    }

    .typing-indicator.visible {
      display: flex;
    }

    .typing-bubble {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 18px;
      background: var(--bg-secondary);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      border-bottom-left-radius: 2px;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-tertiary);
      animation: typingBounce 1.2s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typingBounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* ===== INPUT ROW ===== */
    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 12px 20px 16px;
      border-top: 0.5px solid var(--border);
      flex-shrink: 0;
    }

    .input-row textarea {
      flex: 1;
      resize: none;
      border: 0.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      background: var(--bg-secondary);
      outline: none;
      min-height: 40px;
      max-height: 84px;
      overflow-y: auto;
      transition: border-color 0.15s;
    }

    .input-row textarea::placeholder {
      color: var(--text-tertiary);
    }

    .input-row textarea:focus {
      border-color: var(--border-hover);
    }

    .send-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: var(--info-bg);
      color: var(--info-text);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .send-btn:not(:disabled):hover {
      opacity: 0.85;
    }

    /* ===== EMPTY STATE ===== */
    .empty-doc-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 12px;
      color: var(--text-tertiary);
      font-size: 12px;
      text-align: center;
      gap: 4px;
    }

    /* ===== UTILITY ===== */
    .message-time {
      font-size: 10px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    .message-row.user .message-time {
      text-align: right;
    }
  </style>
</head>

<body>

  <div class="app-shell">

    <!-- ===== LEFT SIDEBAR ===== -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Knowledge base</h2>
        <span class="doc-count" id="docCountLabel">0 documents indexed</span>
      </div>

      <div class="upload-zone" id="uploadZone">
        <i class="ti ti-upload"></i>
        <span class="upload-label">Drop files here</span>
        <span class="upload-hint">PDF, DOCX, TXT</span>
        <input type="file" id="fileInput" accept=".pdf,.docx,.txt" multiple>
      </div>

      <div class="doc-list" id="docList">
        <div class="empty-doc-list" id="emptyDocMsg">
          <span>No documents yet</span>
          <span>Upload files to get started</span>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-value" id="statDocs">0</div>
          <div class="stat-label">Docs</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statChunks">0</div>
          <div class="stat-label">Chunks</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statQueries">0</div>
          <div class="stat-label">Queries</div>
        </div>
      </div>
    </aside>

    <!-- ===== RIGHT PANEL ===== -->
    <main class="chat-panel">
      <div class="top-bar">
        <div class="top-bar-left">
          <h1>AI Knowledge Assistant</h1>
          <div class="top-subtitle">Searching across all documents</div>
        </div>
        <div class="top-bar-right">
          <div id="docPills"></div>
          <button class="clear-chat-btn" id="clearChatBtn" title="Clear chat">
            <i class="ti ti-trash"></i>
          </button>
        </div>
      </div>

      <div class="messages-area" id="messagesArea">
        <!-- Messages rendered here by JS -->

        <!-- Typing indicator -->
        <div class="typing-indicator" id="typingIndicator">
          <div class="typing-bubble">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      </div>

      <div class="input-row">
        <textarea id="chatInput" rows="1" placeholder="Ask anything about your documents..."></textarea>
        <button class="send-btn" id="sendBtn" title="Send message">
          <i class="ti ti-send"></i>
        </button>
      </div>
    </main>

  </div>

  <script>
    // ===================================================================
    // WEBHOOK PLACEHOLDERS — Replace these with your n8n webhook URLs
    // ===================================================================
    const INGESTION_WEBHOOK_URL = 'https://flexxx191004.app.n8n.cloud/webhook/d2df48f8-29c0-4faa-9e26-eba68733f1f2';
    const CHAT_WEBHOOK_URL = 'https://flexxx191004.app.n8n.cloud/webhook/638e21ce-52e8-4bbe-b3df-d6d9978e4eb1';

    // ===================================================================
    // SESSION ID — persisted in localStorage so n8n memory works across refreshes
    // ===================================================================
    let SESSION_ID = localStorage.getItem('ka_sessionId');
    if (!SESSION_ID) {
      SESSION_ID = 'sess_' + crypto.randomUUID();
      localStorage.setItem('ka_sessionId', SESSION_ID);
    }

    // ===================================================================
    // STATE
    // ===================================================================
    let documents = JSON.parse(localStorage.getItem('ka_documents') || '[]');
    let messages = JSON.parse(localStorage.getItem('ka_messages') || '[]');
    let queryCount = parseInt(localStorage.getItem('ka_queryCount') || '0', 10);
    let selectedDocId = null;
    let isWaiting = false;

    // ===================================================================
    // DOM REFERENCES
    // ===================================================================
    const $ = (sel) => document.querySelector(sel);
    const docCountLabel = $('#docCountLabel');
    const docListEl = $('#docList');
    const emptyDocMsg = $('#emptyDocMsg');
    const statDocs = $('#statDocs');
    const statChunks = $('#statChunks');
    const statQueries = $('#statQueries');
    const uploadZone = $('#uploadZone');
    const fileInput = $('#fileInput');
    const messagesArea = $('#messagesArea');
    const typingIndicator = $('#typingIndicator');
    const chatInput = $('#chatInput');
    const sendBtn = $('#sendBtn');
    const clearChatBtn = $('#clearChatBtn');
    const docPills = $('#docPills');

    // ===================================================================
    // HELPERS
    // ===================================================================

    /** Get file extension from filename */
    function getExt(filename) {
      const parts = filename.split('.');
      return parts.length > 1 ? parts.pop().toLowerCase() : '';
    }

    /** Return the tabler icon class for a file type */
    function fileIconClass(ext) {
      if (ext === 'pdf') return 'ti ti-file-type-pdf';
      if (ext === 'docx' || ext === 'doc') return 'ti ti-file-type-doc';
      return 'ti ti-file-text';
    }

    /** Return a CSS class for file type color */
    function fileColorClass(ext) {
      if (ext === 'pdf') return 'pdf';
      if (ext === 'docx' || ext === 'doc') return 'docx';
      return 'txt';
    }

    /** Format bytes to human-readable size */
    function formatSize(bytes) {
      if (!bytes && bytes !== 0) return '';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    /** Format timestamp to time string */
    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    /** Persist documents to localStorage */
    function saveDocs() {
      localStorage.setItem('ka_documents', JSON.stringify(documents));
    }

    /** Persist messages to localStorage */
    function saveMessages() {
      localStorage.setItem('ka_messages', JSON.stringify(messages));
    }

    /** Persist query count */
    function saveQueryCount() {
      localStorage.setItem('ka_queryCount', String(queryCount));
    }

    /** Scroll messages area to the bottom */
    function scrollToBottom() {
      requestAnimationFrame(() => {
        messagesArea.scrollTop = messagesArea.scrollHeight;
      });
    }

    // ===================================================================
    // STATS UPDATE
    // ===================================================================
    function updateStats() {
      const readyDocs = documents.filter(d => d.status === 'ready');
      const totalChunks = documents.reduce((sum, d) => sum + (d.chunks || 0), 0);

      statDocs.textContent = readyDocs.length;
      statChunks.textContent = totalChunks;
      statQueries.textContent = queryCount;

      const totalDocs = documents.length;
      docCountLabel.textContent = totalDocs + ' document' + (totalDocs !== 1 ? 's' : '') + ' indexed';
    }

    // ===================================================================
    // DOC PILLS (top bar)
    // ===================================================================
    function renderDocPills() {
      const readyDocs = documents.filter(d => d.status === 'ready');
      docPills.innerHTML = '';

      if (readyDocs.length === 0) return;

      const pill = document.createElement('span');
      pill.className = 'doc-pill';
      pill.textContent = readyDocs[0].filename;
      docPills.appendChild(pill);

      if (readyDocs.length > 1) {
        const more = document.createElement('span');
        more.className = 'doc-pill-more';
        more.textContent = '+' + (readyDocs.length - 1);
        docPills.appendChild(more);
      }
    }

    // ===================================================================
    // DOCUMENT LIST RENDERING
    // ===================================================================
    function renderDocList() {
      // Remove all doc cards (keep empty message element)
      docListEl.querySelectorAll('.doc-card').forEach(el => el.remove());

      if (documents.length === 0) {
        emptyDocMsg.style.display = '';
      } else {
        emptyDocMsg.style.display = 'none';
      }

      documents.forEach((doc, idx) => {
        const card = document.createElement('div');
        card.className = 'doc-card' + (doc.id === selectedDocId ? ' active' : '');
        card.dataset.docId = doc.id;

        const ext = getExt(doc.filename);

        // File icon
        const icon = document.createElement('i');
        icon.className = fileIconClass(ext) + ' file-icon ' + fileColorClass(ext);

        // Info block
        const info = document.createElement('div');
        info.className = 'doc-info';

        const name = document.createElement('div');
        name.className = 'doc-name';
        name.textContent = doc.filename;
        name.title = doc.filename;

        const meta = document.createElement('div');
        meta.className = 'doc-meta';
        const parts = [];
        if (doc.chunks != null) parts.push(doc.chunks + ' chunks');
        if (doc.size) parts.push(formatSize(doc.size));
        meta.textContent = parts.join(' · ') || '';

        info.appendChild(name);
        info.appendChild(meta);

        // Status dot
        const dot = document.createElement('span');
        dot.className = 'status-dot ' + doc.status;

        card.appendChild(icon);
        card.appendChild(info);

        // Status label for non-ready states
        if (doc.status === 'indexing') {
          const lbl = document.createElement('span');
          lbl.className = 'doc-status-label indexing';
          lbl.textContent = 'Indexing...';
          card.appendChild(lbl);
        } else if (doc.status === 'failed') {
          const lbl = document.createElement('span');
          lbl.className = 'doc-status-label failed';
          lbl.textContent = 'Failed';
          card.appendChild(lbl);
        }

        card.appendChild(dot);

        // Delete button
        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.title = 'Remove';
        del.innerHTML = '<i class="ti ti-x"></i>';
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          documents = documents.filter(d => d.id !== doc.id);
          saveDocs();
          renderDocList();
          updateStats();
          renderDocPills();
        });
        card.appendChild(del);

        // Click to select
        card.addEventListener('click', () => {
          selectedDocId = doc.id;
          renderDocList();
        });

        docListEl.appendChild(card);
      });

      updateStats();
      renderDocPills();
    }

    // ===================================================================
    // FILE UPLOAD LOGIC
    // ===================================================================

    /** Extract plain text from a PDF file using pdf.js (runs in browser, avoids DOMMatrix error in Node.js) */
    async function extractPdfText(file) {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join(' ') + '\n\n';
      }
      return fullText;
    }

    async function handleFiles(files) {
      const allowed = ['pdf', 'txt', 'docx'];

      for (const file of Array.from(files)) {
        const ext = getExt(file.name);
        if (!allowed.includes(ext)) continue;

        const doc = {
          id: crypto.randomUUID(),
          filename: file.name,
          status: 'indexing',
          chunks: null,
          size: file.size
        };
        documents.push(doc);
        saveDocs();
        renderDocList();

        try {
          // Extract text from file before sending to n8n
          let textContent = '';
          if (ext === 'pdf') {
            textContent = await extractPdfText(file);
          } else {
            textContent = await file.text();
          }

          const res = await fetch(INGESTION_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              filename: file.name,
              text: textContent
            })
          });

          if (!res.ok) throw new Error('Upload failed with status ' + res.status);

          const data = await res.json();

          const idx = documents.findIndex(d => d.id === doc.id);
          if (idx !== -1) {
            documents[idx].status = 'ready';
            if (data.chunks != null) documents[idx].chunks = data.chunks;
            if (data.size != null) documents[idx].size = data.size;
            if (data.filename) documents[idx].filename = data.filename;
            saveDocs();
            renderDocList();
          }
        } catch (err) {
          console.error('Upload error:', err);
          const idx = documents.findIndex(d => d.id === doc.id);
          if (idx !== -1) {
            documents[idx].status = 'failed';
            saveDocs();
            renderDocList();
          }
        }
      }
    }

    // Upload zone — click
    uploadZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handleFiles(fileInput.files);
      fileInput.value = '';
    });

    // Upload zone — drag & drop
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('drag-over');
    });

    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('drag-over');
    });

    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('drag-over');
      if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });

    // ===================================================================
    // MESSAGES RENDERING
    // ===================================================================

    /** Create a message row DOM element */
    function createMessageEl(msg) {
      const row = document.createElement('div');
      row.className = 'message-row ' + msg.role;

      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = msg.content;
      wrapper.appendChild(bubble);

      // Source citations (AI messages only)
      if (msg.role === 'ai' && msg.sources && msg.sources.length > 0) {
        msg.sources.forEach(src => {
          const card = document.createElement('div');
          card.className = 'citation-card';

          const header = document.createElement('div');
          header.className = 'citation-header';
          header.innerHTML = '<i class="ti ti-bookmark"></i> Source: ' + escapeHTML(src.filename || 'Unknown');

          card.appendChild(header);

          const detailParts = [];
          if (src.pages) detailParts.push('Page ' + src.pages);
          if (src.section) detailParts.push('Section ' + src.section);
          if (src.score) detailParts.push('Relevance score ' + src.score);

          if (detailParts.length) {
            const detail = document.createElement('div');
            detail.className = 'citation-detail';
            detail.textContent = detailParts.join(' · ');
            card.appendChild(detail);
          }

          wrapper.appendChild(card);
        });
      }

      // Timestamp
      if (msg.timestamp) {
        const time = document.createElement('div');
        time.className = 'message-time';
        time.textContent = formatTime(msg.timestamp);
        wrapper.appendChild(time);
      }

      row.appendChild(wrapper);
      return row;
    }

    /** Escape HTML for safe rendering */
    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    /** Render all messages from state */
    function renderMessages() {
      // Remove all message rows but keep typing indicator
      messagesArea.querySelectorAll('.message-row').forEach(el => el.remove());

      messages.forEach(msg => {
        const el = createMessageEl(msg);
        messagesArea.insertBefore(el, typingIndicator);
      });

      scrollToBottom();
    }

    /** Add a single new message to the DOM and state */
    function addMessage(role, content, sources = null) {
      const msg = {
        role,
        content,
        sources,
        timestamp: Date.now()
      };
      messages.push(msg);
      saveMessages();

      const el = createMessageEl(msg);
      messagesArea.insertBefore(el, typingIndicator);
      scrollToBottom();
    }

    /** Render the welcome message (not persisted) */
    function renderWelcome() {
      const readyCount = documents.filter(d => d.status === 'ready').length;
      const welcomeText = `Hello! I have indexed ${readyCount} document${readyCount !== 1 ? 's' : ''} in your knowledge base. Ask me anything and I will find the most relevant information with source citations.`;

      const row = document.createElement('div');
      row.className = 'message-row ai';
      row.id = 'welcomeMessage';

      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = welcomeText;

      wrapper.appendChild(bubble);
      row.appendChild(wrapper);

      messagesArea.insertBefore(row, typingIndicator);
      scrollToBottom();
    }

    // ===================================================================
    // CHAT LOGIC
    // ===================================================================

    /** Parse AI response for sources */
    function parseResponse(text) {
      const separator = '---SOURCES---';
      const idx = text.indexOf(separator);

      let answer, sources = [];

      if (idx !== -1) {
        answer = text.substring(0, idx).trim();
        const sourcesStr = text.substring(idx + separator.length).trim();

        // Parse each source line: "filename: X | pages: Y | score: Z"
        sourcesStr.split('\n').forEach(line => {
          line = line.trim();
          if (!line) return;

          const src = {};
          line.split('|').forEach(part => {
            const [key, ...valParts] = part.split(':');
            if (key && valParts.length) {
              const k = key.trim().toLowerCase();
              const v = valParts.join(':').trim();
              if (k === 'filename') src.filename = v;
              else if (k === 'pages' || k === 'page') src.pages = v;
              else if (k === 'section') src.section = v;
              else if (k === 'score') src.score = v;
            }
          });
          if (Object.keys(src).length) sources.push(src);
        });
      } else {
        answer = text.trim();
      }

      return { answer, sources: sources.length ? sources : null };
    }

    /** Send a user message and get AI response */
    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || isWaiting) return;

      // Remove welcome message if present
      const welcome = document.getElementById('welcomeMessage');
      if (welcome) welcome.remove();

      // Add user message
      addMessage('user', text);
      chatInput.value = '';
      autoResizeTextarea();

      // Show typing indicator
      isWaiting = true;
      sendBtn.disabled = true;
      typingIndicator.classList.add('visible');
      scrollToBottom();

      // Increment queries
      queryCount++;
      saveQueryCount();
      updateStats();

      try {
        const res = await fetch(CHAT_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            sessionId: SESSION_ID
          })
        });

        if (!res.ok) throw new Error('Webhook request failed');

        // n8n returns JSON: { "output": "answer text ---SOURCES--- ..." }
        // Handle both JSON and plain text responses
        let responseText = '';
        const contentType = res.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          const data = await res.json();
          // Extract output field from JSON response
          responseText = data.output || data.response || data.text || data.message || JSON.stringify(data);
        } else {
          responseText = await res.text();
        }

        if (!responseText || !responseText.trim()) {
          addMessage('ai', 'No response received from the assistant.');
        } else {
          const { answer, sources } = parseResponse(responseText);
          addMessage('ai', answer, sources);
        }
      } catch (err) {
        addMessage('ai', 'Something went wrong. Please check your connection.');
      } finally {
        isWaiting = false;
        sendBtn.disabled = false;
        typingIndicator.classList.remove('visible');
        scrollToBottom();
      }
    }

    // ===================================================================
    // INPUT HANDLING
    // ===================================================================

    /** Auto-expand textarea up to max 3 rows */
    function autoResizeTextarea() {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 84) + 'px';
    }

    chatInput.addEventListener('input', autoResizeTextarea);

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    // ===================================================================
    // CLEAR CHAT
    // ===================================================================
    clearChatBtn.addEventListener('click', () => {
      messages = [];
      queryCount = 0;
      saveMessages();
      saveQueryCount();
      renderMessages();
      updateStats();
      renderWelcome();
    });

    // ===================================================================
    // INITIALIZATION
    // ===================================================================
    function init() {
      renderDocList();
      updateStats();

      if (messages.length > 0) {
        renderMessages();
      } else {
        renderWelcome();
      }
    }

    init();
  </script>
